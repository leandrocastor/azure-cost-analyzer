<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azure Cost Analyzer Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface2: #263248;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --green: #4ade80;
        --yellow: #facc15;
        --red: #f87171;
        --purple: #c084fc;
        --radius: 12px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--accent);
      }
      header span {
        font-size: 0.75rem;
        color: var(--muted);
      }
      #status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        display: inline-block;
        margin-right: 4px;
      }
      #status-dot.ok {
        background: var(--green);
      }
      #status-dot.err {
        background: var(--red);
      }
      #header-status {
        margin-left: auto;
      }
      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .error-banner {
        background: #7f1d1d;
        border: 1px solid var(--red);
        border-radius: var(--radius);
        padding: 1rem;
        color: var(--red);
        display: none;
      }
      .error-banner.visible {
        display: block;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.25rem;
      }
      .kpi-card {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 1.5rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .kpi-card .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .kpi-card .value {
        font-size: 2rem;
        font-weight: 700;
      }
      .kpi-card .sub {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.25rem;
      }
      .kpi-card.cost .value {
        color: var(--accent);
      }
      .kpi-card.idle .value {
        color: var(--yellow);
      }
      .kpi-card.recs .value {
        color: var(--purple);
      }
      .kpi-card.savings .value {
        color: var(--green);
      }
      .skeleton {
        background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 6px;
        height: 2rem;
        width: 60%;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      section h2 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .table-controls {
        display: flex;
        gap: 0.75rem;
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .table-controls input,
      .table-controls select {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.4rem 0.75rem;
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
      }
      .table-controls input:focus,
      .table-controls select:focus {
        border-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th {
        background: var(--surface2);
        padding: 0.75rem 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: var(--surface2);
      }
      .badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge.low {
        background: #14532d;
        color: var(--green);
      }
      .badge.medium {
        background: #713f12;
        color: var(--yellow);
      }
      .badge.high {
        background: #7f1d1d;
        color: var(--red);
      }
      .badge.new {
        background: #1e3a5f;
        color: var(--accent);
      }
      .score-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .score-bar-inner {
        height: 6px;
        border-radius: 3px;
        background: var(--accent);
        min-width: 4px;
      }
      .rec-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .rec-item {
        padding: 1.25rem;
        border-bottom: 1px solid var(--border);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        align-items: start;
      }
      .rec-item:last-child {
        border-bottom: none;
      }
      .rec-item:hover {
        background: var(--surface2);
      }
      .rec-title {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .rec-desc {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .rec-meta {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }
      .rec-stats {
        text-align: right;
      }
      .rec-savings {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--green);
      }
      .rec-roi {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.25rem;
      }
      .chart-card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        padding: 1.25rem;
      }
      .chart-card h3 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      .bar-chart {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 120px 1fr 70px;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
      }
      .bar-row .bar-label {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-track {
        background: var(--surface2);
        border-radius: 4px;
        height: 8px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
        background: var(--accent);
        transition: width 0.4s ease;
      }
      .bar-row .bar-val {
        text-align: right;
        color: var(--text);
        font-weight: 500;
      }
      .empty {
        padding: 2rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      #refresh-btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.15s;
      }
      #refresh-btn:hover {
        background: var(--border);
      }
      #refresh-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      @media (max-width: 640px) {
        header {
          padding: 1rem;
        }
        #header-status {
          margin-left: 0;
          width: 100%;
        }
        main {
          padding: 1rem;
        }
        .bar-row {
          grid-template-columns: 80px 1fr 55px;
        }
        .rec-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span id="status-dot"></span>
      <h1>Azure Cost Analyzer Dashboard</h1>
      <button id="refresh-btn" type="button">↻ Refresh</button>
      <span id="header-status">
        <span id="last-updated"></span>
      </span>
    </header>
    <main>
      <div id="error-banner" class="error-banner"></div>

      <div class="kpi-grid">
        <div class="kpi-card cost">
          <div class="label">Total Cost (MTD)</div>
          <div class="value" id="kpi-cost"><div class="skeleton"></div></div>
          <div class="sub" id="kpi-cost-sub"></div>
        </div>
        <div class="kpi-card idle">
          <div class="label">Idle Resources</div>
          <div class="value" id="kpi-idle"><div class="skeleton"></div></div>
          <div class="sub" id="kpi-idle-sub"></div>
        </div>
        <div class="kpi-card recs">
          <div class="label">Recommendations</div>
          <div class="value" id="kpi-recs"><div class="skeleton"></div></div>
          <div class="sub" id="kpi-recs-sub"></div>
        </div>
        <div class="kpi-card savings">
          <div class="label">Annual Savings Opportunity</div>
          <div class="value" id="kpi-savings"><div class="skeleton"></div></div>
          <div class="sub" id="kpi-savings-sub">Potential savings if all recommendations applied</div>
        </div>
      </div>

      <section>
        <h2>Idle Resources</h2>
        <div class="card">
          <div class="table-controls">
            <input id="idle-filter" type="text" placeholder="Filter by name or resource group…" />
            <select id="idle-sort">
              <option value="idleScore-desc">Idle Score ↓</option>
              <option value="idleScore-asc">Idle Score ↑</option>
              <option value="estimatedMonthlySavings-desc">Savings ↓</option>
              <option value="estimatedMonthlySavings-asc">Savings ↑</option>
            </select>
          </div>
          <div id="idle-table-container"><div class="empty">Loading…</div></div>
        </div>
      </section>

      <section>
        <h2>Recommendations</h2>
        <div class="card" id="recs-container"><div class="empty">Loading…</div></div>
      </section>

      <section>
        <h2>Cost Breakdown</h2>
        <div class="charts-grid">
          <div class="chart-card">
            <h3>By Service</h3>
            <div id="chart-service" class="bar-chart"><div class="empty">Loading…</div></div>
          </div>
          <div class="chart-card">
            <h3>By Resource Group</h3>
            <div id="chart-rg" class="bar-chart"><div class="empty">Loading…</div></div>
          </div>
          <div class="chart-card">
            <h3>By Location</h3>
            <div id="chart-loc" class="bar-chart"><div class="empty">Loading…</div></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      let idleData = [];
      let recsData = [];

      const levelValues = ['low', 'medium', 'high'];
      const fmt = (n) =>
        typeof n === 'number' ? '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—';
      const fmtFull = (n) =>
        typeof n === 'number'
          ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
          : '—';

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, function (character) {
          return (
            {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            }[character] || character
          );
        });
      }

      function textValue(value, fallback) {
        if (value === null || value === undefined || value === '') {
          return fallback || '—';
        }
        return String(value);
      }

      function clearNode(node) {
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
      }

      function appendEmpty(container, message) {
        clearNode(container);
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = message;
        container.appendChild(empty);
      }

      function clampLevel(value) {
        const normalized = String(value ?? 'medium').toLowerCase();
        return levelValues.includes(normalized) ? normalized : 'medium';
      }

      function setStatus(ok) {
        const dot = document.getElementById('status-dot');
        dot.className = ok ? 'ok' : 'err';
      }

      function showError(msg) {
        const el = document.getElementById('error-banner');
        el.textContent = 'Error: ' + textValue(msg, 'Failed to load data');
        el.classList.add('visible');
      }

      function clearError() {
        document.getElementById('error-banner').classList.remove('visible');
      }

      async function fetchJSON(url) {
        const res = await fetch(url);
        if (!res.ok) {
          let message = url + ' returned ' + res.status;
          try {
            const body = await res.json();
            message = textValue(body && body.error, message);
          } catch (_error) {}
          throw new Error(message);
        }
        return res.json();
      }

      function renderKPI(id, value, sub) {
        document.getElementById(id).textContent = value;
        const subEl = document.getElementById(id + '-sub');
        if (subEl && sub != null) {
          subEl.textContent = sub;
        }
      }

      function createBadge(text, tone) {
        const badge = document.createElement('span');
        badge.className = 'badge ' + tone;
        badge.textContent = text;
        return badge;
      }

      function renderIdleTable() {
        const filter = document.getElementById('idle-filter').value.toLowerCase();
        const sortValue = document.getElementById('idle-sort').value;
        const separatorIndex = sortValue.lastIndexOf('-');
        const sortField = separatorIndex >= 0 ? sortValue.slice(0, separatorIndex) : 'idleScore';
        const sortDir = separatorIndex >= 0 ? sortValue.slice(separatorIndex + 1) : 'desc';
        const container = document.getElementById('idle-table-container');

        const rows = idleData
          .filter(function (item) {
            const name = textValue(item.resource && item.resource.name, '').toLowerCase();
            const resourceGroup = textValue(item.resource && item.resource.resourceGroup, '').toLowerCase();
            return !filter || name.includes(filter) || resourceGroup.includes(filter);
          })
          .slice()
          .sort(function (left, right) {
            const leftValue = Number(left[sortField] ?? 0);
            const rightValue = Number(right[sortField] ?? 0);
            return sortDir === 'asc' ? leftValue - rightValue : rightValue - leftValue;
          });

        if (!rows.length) {
          appendEmpty(container, 'No idle resources found.');
          return;
        }

        clearNode(container);

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['Name', 'Type', 'Resource Group', 'Location', 'Idle Score', 'Monthly Savings', 'Reason'].forEach(
          function (label) {
            const th = document.createElement('th');
            th.textContent = label;
            headerRow.appendChild(th);
          },
        );
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        rows.forEach(function (item) {
          const res = item.resource || {};
          const row = document.createElement('tr');
          const type = textValue(res.type, '').split('/').pop() || '—';
          const score = Number(item.idleScore ?? 0);

          const nameCell = document.createElement('td');
          const strong = document.createElement('strong');
          strong.textContent = textValue(res.name, '—');
          nameCell.appendChild(strong);
          row.appendChild(nameCell);

          const typeCell = document.createElement('td');
          typeCell.appendChild(createBadge(type, 'new'));
          row.appendChild(typeCell);

          [textValue(res.resourceGroup, '—'), textValue(res.location, '—')].forEach(function (value) {
            const td = document.createElement('td');
            td.textContent = value;
            row.appendChild(td);
          });

          const scoreCell = document.createElement('td');
          const scoreBar = document.createElement('div');
          scoreBar.className = 'score-bar';
          const scoreBarInner = document.createElement('div');
          scoreBarInner.className = 'score-bar-inner';
          scoreBarInner.style.width = Math.max(4, Math.min(80, score)) + 'px';
          const scoreLabel = document.createElement('span');
          scoreLabel.textContent = String(score);
          scoreBar.appendChild(scoreBarInner);
          scoreBar.appendChild(scoreLabel);
          scoreCell.appendChild(scoreBar);
          row.appendChild(scoreCell);

          const savingsCell = document.createElement('td');
          savingsCell.style.color = 'var(--green)';
          savingsCell.textContent = fmtFull(item.estimatedMonthlySavings);
          row.appendChild(savingsCell);

          const reasonCell = document.createElement('td');
          reasonCell.style.color = 'var(--muted)';
          reasonCell.style.fontSize = '0.8rem';
          reasonCell.textContent = textValue(item.reason, '—');
          row.appendChild(reasonCell);

          tbody.appendChild(row);
        });
        table.appendChild(tbody);
        container.appendChild(table);
      }

      function renderRecs() {
        const container = document.getElementById('recs-container');
        if (!recsData.length) {
          appendEmpty(container, 'No recommendations available.');
          return;
        }

        clearNode(container);

        const list = document.createElement('div');
        list.className = 'rec-list';

        recsData.forEach(function (recommendation) {
          const item = document.createElement('div');
          item.className = 'rec-item';

          const content = document.createElement('div');
          content.dataset.safeTitle = escapeHtml(textValue(recommendation.title, '—'));
          content.dataset.safeDescription = escapeHtml(textValue(recommendation.description, ''));

          const title = document.createElement('div');
          title.className = 'rec-title';
          title.textContent = textValue(recommendation.title, '—');
          content.appendChild(title);

          const description = document.createElement('div');
          description.className = 'rec-desc';
          description.textContent = textValue(recommendation.description, '');
          content.appendChild(description);

          const meta = document.createElement('div');
          meta.className = 'rec-meta';
          meta.appendChild(createBadge('Risk: ' + clampLevel(recommendation.risk), clampLevel(recommendation.risk)));
          meta.appendChild(createBadge('Effort: ' + clampLevel(recommendation.effort), clampLevel(recommendation.effort)));
          meta.appendChild(createBadge(textValue(recommendation.actionType, '—'), 'new'));
          meta.appendChild(createBadge(textValue(recommendation.status, '—'), 'new'));
          content.appendChild(meta);

          const stats = document.createElement('div');
          stats.className = 'rec-stats';

          const annualSavings = document.createElement('div');
          annualSavings.className = 'rec-savings';
          annualSavings.textContent = fmt(recommendation.annualSavings) + '/yr';
          stats.appendChild(annualSavings);

          const roi = document.createElement('div');
          roi.className = 'rec-roi';
          roi.textContent =
            'ROI: ' +
            (typeof recommendation.roi === 'number' ? recommendation.roi.toFixed(1) + 'x' : '—');
          stats.appendChild(roi);

          const monthlySavings = document.createElement('div');
          monthlySavings.style.fontSize = '0.75rem';
          monthlySavings.style.color = 'var(--muted)';
          monthlySavings.style.marginTop = '2px';
          monthlySavings.textContent = fmtFull(recommendation.monthlySavings) + '/mo';
          stats.appendChild(monthlySavings);

          item.appendChild(content);
          item.appendChild(stats);
          list.appendChild(item);
        });

        container.appendChild(list);
      }

      function renderBarChart(containerId, data) {
        const container = document.getElementById(containerId);
        const entries = data && typeof data === 'object' ? Object.entries(data) : [];

        if (!entries.length) {
          appendEmpty(container, 'No data.');
          return;
        }

        clearNode(container);

        entries
          .sort(function (left, right) {
            return right[1] - left[1];
          })
          .forEach(function (entry, index, orderedEntries) {
            const labelText = textValue(entry[0], '—');
            const value = Number(entry[1] ?? 0);
            const max = Number(orderedEntries[0][1] ?? 1) || 1;
            const pct = Math.round((value / max) * 100);

            const row = document.createElement('div');
            row.className = 'bar-row';
            row.dataset.safeLabel = escapeHtml(labelText);

            const label = document.createElement('div');
            label.className = 'bar-label';
            label.textContent = labelText;
            label.title = labelText;
            row.appendChild(label);

            const track = document.createElement('div');
            track.className = 'bar-track';
            const fill = document.createElement('div');
            fill.className = 'bar-fill';
            fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
            track.appendChild(fill);
            row.appendChild(track);

            const valueLabel = document.createElement('div');
            valueLabel.className = 'bar-val';
            valueLabel.textContent = fmt(value);
            row.appendChild(valueLabel);

            container.appendChild(row);
          });
      }

      async function loadAll() {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        clearError();

        try {
          const [health, summary, idle, recs, costs] = await Promise.all([
            fetchJSON('/api/health'),
            fetchJSON('/api/summary'),
            fetchJSON('/api/resources/idle'),
            fetchJSON('/api/recommendations'),
            fetchJSON('/api/costs?period=1&groupBy=service'),
          ]);

          renderKPI('kpi-cost', fmt(summary.totalCost), 'Month-to-date');
          renderKPI('kpi-idle', String(summary.idleResourceCount), 'Resources with low utilization');
          renderKPI('kpi-recs', String(summary.recommendationCount), 'Optimization opportunities');
          renderKPI(
            'kpi-savings',
            fmt(summary.annualSavingsOpportunity),
            'Potential savings if all recommendations applied',
          );

          idleData = Array.isArray(idle) ? idle : [];
          recsData = Array.isArray(recs) ? recs : [];

          renderIdleTable();
          renderRecs();

          renderBarChart('chart-service', costs && costs.byService);
          renderBarChart('chart-rg', costs && costs.byResourceGroup);
          renderBarChart('chart-loc', costs && costs.byLocation);

          setStatus(Boolean(health && health.status === 'ok'));
          document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
        } catch (error) {
          setStatus(false);
          showError(error && error.message ? error.message : 'Failed to load data');
        } finally {
          btn.disabled = false;
        }
      }

      document.getElementById('refresh-btn').addEventListener('click', loadAll);
      document.getElementById('idle-filter').addEventListener('input', renderIdleTable);
      document.getElementById('idle-sort').addEventListener('change', renderIdleTable);

      loadAll();
    </script>
  </body>
</html>
