<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azure Cost Analyzer Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 3rem;
      }
      .card {
        max-width: 800px;
        margin: 0 auto;
        background: #1e293b;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
      }
      code {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Azure Cost Analyzer Dashboard</h1>
      <p>The enterprise dashboard API is running. Connect your frontend to:</p>
      <ul>
        <li><code>/api/costs</code></li>
        <li><code>/api/resources/idle</code></li>
        <li><code>/api/recommendations</code></li>
        <li><code>/api/summary</code></li>
      </ul>
      <p>Replace this placeholder with your preferred SPA or BI frontend.</p>
    </div>
  </body>
</html>
