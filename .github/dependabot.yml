version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      azure-sdks:
        patterns:
          - "@azure/*"
      dev-tools:
        patterns:
          - "@typescript-eslint/*"
          - "eslint*"
          - "vitest"
          - "@vitest/*"
          - "tsc-alias"
          - "prettier"
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
